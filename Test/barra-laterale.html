<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 3D - Barra Laterale</title>
    <link rel="stylesheet" href="barra-laterale.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            Laboratorio 3D
        </header>

        <!-- PROPRIETÀ STANZA -->
        <div class="card">
            <div class="card-title">Proprietà Stanza</div>
            
            <!-- Colore Pavimento -->
            <div class="form-group">
                <label>Pavimento</label>
                <div class="color-picker-row">
                    <div class="color-preview-box">
                        <div class="color-swatch-inner" id="swatch-floor" style="background-color: #1f2937;"></div>
                        <input type="color" id="color-picker-floor" value="#1f2937">
                    </div>
                    <button class="color-text-btn" id="btn-floor-text" style="background-color: #1f2937;">#1F2937 (Pavimento)</button>
                </div>
            </div>

            <!-- Colore Muri -->
            <div class="form-group">
                <label>Muri</label>
                <div class="color-picker-row">
                    <div class="color-preview-box">
                        <div class="color-swatch-inner" id="swatch-walls" style="background-color: #111827;"></div>
                        <input type="color" id="color-picker-walls" value="#111827">
                    </div>
                    <button class="color-text-btn" id="btn-walls-text" style="background-color: #111827;">#111827 (Muri)</button>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Largh.</label>
                    <input type="text" value="16">
                </div>
                <div class="form-group">
                    <label>Altezza</label>
                    <input type="text" value="8">
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Prof.</label>
                    <input type="text" value="16">
                </div>
                <div class="form-group">
                    <label>Unità di Misura</label>
                    <select id="room-unit">
                        <option value="cm">Centimetri (cm)</option>
                        <option value="m">Metri (m)</option>
                        <option value="mm">Millimetri (mm)</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="btn-aggiorna-stanza">Aggiorna Stanza</button>
        </div>

        <!-- AGGIUNGI MOBILE -->
        <div class="card">
            <div class="card-title">Aggiungi Mobile</div>
            
            <div class="form-group">
                <label>Tipo</label>
                <select>
                    <option>Cubo / Divano</option>
                    <option>Tavolo</option>
                    <option>Sedia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Colore</label>
                <div class="color-picker-row">
                    <div class="color-preview-box">
                        <div class="color-swatch-inner" id="swatch-add" style="background-color: #ff7a00;"></div>
                        <input type="color" id="color-picker-add" value="#ff7a00">
                    </div>
                    <button class="color-text-btn" id="btn-add-text" style="background-color: #ff7a00;">#FF7A00 (Personalizzato)</button>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Larghezza</label>
                    <input type="text" value="2.5">
                </div>
                <div class="form-group">
                    <label>Altezza</label>
                    <input type="text" value="1.2">
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Profondità</label>
                    <input type="text" value="2.0">
                </div>
                <div class="form-group">
                    <label>Unità di Misura</label>
                    <select id="add-unit">
                        <option value="cm">Centimetri (cm)</option>
                        <option value="m">Metri (m)</option>
                        <option value="mm">Millimetri (mm)</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="btn-aggiungi-scena">Aggiungi alla Scena</button>
        </div>

        <!-- MODIFICA SELEZIONATO -->
        <div class="card">
            <div class="card-title">Modifica Selezionato</div>
            
            <div class="form-group">
                <label>Oggetto Selezionato</label>
            </div>

            <div class="form-group">
                <label>Colore Mobile</label>
                <div class="color-picker-row">
                    <div class="color-preview-box">
                        <div class="color-swatch-inner" id="swatch-edit" style="background-color: #ff7a00;"></div>
                        <input type="color" id="color-picker-edit" value="#ff7a00">
                    </div>
                    <button class="color-text-btn" id="btn-edit-text" style="background-color: #ff7a00;">#FF7A00 (Personalizzato)</button>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Larghezza</label>
                    <input type="text" value="2.5">
                </div>
                <div class="form-group">
                    <label>Altezza</label>
                    <input type="text" value="1.2">
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Profondità</label>
                    <input type="text" value="2">
                </div>
                <div class="form-group">
                    <label>Unità di Misura</label>
                    <select id="edit-unit">
                        <option value="cm">Centimetri (cm)</option>
                        <option value="m">Metri (m)</option>
                        <option value="mm">Millimetri (mm)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-danger" id="btn-elimina-oggetto">Elimina Oggetto</button>
        </div>

        <div class="footer-text">
            Trascina per muovere, tasto destro per ruotare.
        </div>
    </div>

    <script src="barra-laterale.js"></script>
</body>
</html>
